defaults:
  env_name: InvertedPendulum
  seeds: 50
  timesteps: 100_000
  output_dir: ddpg_ip_ji_no_encode
  output_file: ddpg_ip_ji
  dpi: 500 # optional: default is 300
  show_timesteps: true
  show_x_label: true
  show_y_label: true
  format: png
# aggregation: mean

plots:
  - title: 'DDPG Joint Incremental (No Task ID)'
    aggregation: mean
    lines:
      - method: 'ddpg_ip_ji_no_encode/ddpg_ip_ji-s_<s>'
        num_tasks: 3
        test_env: 0
        label: 'P(1)'
        color: "#3A9AB2"
        linewidth: 0.5
        smooth: 1

      - method: 'ddpg_ip_ji_no_encode/ddpg_ip_ji-s_<s>'
        num_tasks: 3
        test_env: 0
        label: 'P(1)'
        color: "#EBCC2A"
        linewidth: 1.5
        smooth: 5

  - title: 'DDPG Joint Incremental (No Task ID)'
    aggregation: iqm
    lines:
      - method: 'ddpg_ip_ji_no_encode/ddpg_ip_ji-s_<s>'
        num_tasks: 3
        test_env: 0
        label: 'P(1)'
        color: "#3A9AB2"
        linewidth: 0.5
        smooth: 1

      - method: 'ddpg_ip_ji_no_encode/ddpg_ip_ji-s_<s>'
        num_tasks: 3
        test_env: 0
        label: 'P(1)'
        color: "#EBCC2A"
        linewidth: 1.5
        smooth: 5



  - title: 'DDPG Joint Incremental (Task ID)'
    aggregation: mean
    lines:
      - method: 'ddpg_ip_ji_encode/ddpg_ip_ji-s_<s>'
        num_tasks: 3
        test_env: 0
        label: 'P(1)'
        color: "#3A9AB2"
        linewidth: 0.5
        smooth: 1

      - method: 'ddpg_ip_ji_encode/ddpg_ip_ji-s_<s>'
        num_tasks: 3
        test_env: 0
        label: 'P(1)'
        color: "#EBCC2A"
        linewidth: 1.5
        smooth: 5

  - title: 'DDPG Joint Incremental (Task ID)'
    aggregation: iqm
    lines:
      - method: 'ddpg_ip_ji_encode/ddpg_ip_ji-s_<s>'
        num_tasks: 3
        test_env: 0
        label: 'P(1)'
        color: "#3A9AB2"
        linewidth: 0.5
        smooth: 1

      - method: 'ddpg_ip_ji_encode/ddpg_ip_ji-s_<s>'
        num_tasks: 3
