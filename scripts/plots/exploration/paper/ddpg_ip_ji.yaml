defaults:
  env_name: InvertedPendulum
  seeds: 50
  timesteps: 100_000
  output_dir: paper
  output_file: ddpg_ip_ji
  dpi: 500 # optional: default is 300
  show_timesteps: true
  show_x_label: true
  show_y_label: true
  format: png
  aggregation: mean_ci

plots:
  - title: 'Task 1 performance'
    lines:
      - method: 'ddpg_ip_ji_encode/ddpg_ip_ji-s_<s>'
        num_tasks: 3
        test_env: 0
        label: 'Task 1'
        color: "#EBCC2A"
        linewidth: 1.5
        smooth: 10

      - method: 'ddpg_ip_ji_encode/ddpg_ip_ji-s_<s>'
        num_tasks: 3
        test_env: 1
        label: 'Task 2'
        color: "#EBCC2A"
        linewidth: 1.5
        smooth: 10

