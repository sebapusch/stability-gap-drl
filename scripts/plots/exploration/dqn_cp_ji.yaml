defaults:
  env_name: InvertedPendulum
  seeds: 50
  timesteps: 200_000
  output_dir: dqn_cp_ji
  output_file: dqn_cp_ji_encode_more_freq_eval
  dpi: 500 # optional: default is 300
  show_timesteps: true
  show_x_label: true
  show_y_label: true
  format: png

plots:
  - title: 'DQN Joint Incremental (Task ID)'
    aggregation: mean
    lines:
      - method: 'dqn_cp_ji_encode_more_freq_eval/dqn_cp_ji-s_<s>'
        num_tasks: 3
        test_env: 0
        label: 'P(1)'
        color: "#3A9AB2"
        stroke_role: dense_raw_curve
        smooth: 1

      - method: 'dqn_cp_ji_encode_more_freq_eval/dqn_cp_ji-s_<s>'
        num_tasks: 3
        test_env: 0
        label: 'P(1)'
        color: "#EBCC2A"
        smooth: 5

  - title: 'DQN Joint Incremental (Task ID)'
    aggregation: iqm
    lines:
      - method: 'dqn_cp_ji_encode_more_freq_eval/dqn_cp_ji-s_<s>'
        num_tasks: 3
        test_env: 0
        label: 'P(1)'
        color: "#3A9AB2"
        stroke_role: raw_curve
        smooth: 1

      - method: 'dqn_cp_ji_encode_more_freq_eval/dqn_cp_ji-s_<s>'
        num_tasks: 3
        test_env: 0
        label: 'P(1)'
        color: "#EBCC2A"
        smooth: 5