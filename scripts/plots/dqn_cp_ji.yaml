defaults:
  env_name: InvertedPendulum
  seeds: 50
  timesteps: 100_000
  output_dir: dqn_cp_ji
  output_file: dqn_cp_ji
  dpi: 500 # optional: default is 300
  show_timesteps: true
  show_x_label: true
  show_y_label: true
  format: png
# aggregation: mean

plots:
  - title: 'DQN Joint Incremental (Task ID)'
    aggregation: mean
    lines:
      - method: 'dqn_cp_ji_encode/dqn_cp_ji-s_<s>'
        num_tasks: 3
        test_env: 0
        label: 'P(1)'
        color: "#3A9AB2"
        linewidth: 0.5
        smooth: 1

      - method: 'dqn_cp_ji_encode/dqn_cp_ji-s_<s>'
        num_tasks: 3
        test_env: 0
        label: 'P(1)'
        color: "#EBCC2A"
        linewidth: 1.5
        smooth: 5

  - title: 'DQN Joint Incremental (Task ID)'
    aggregation: iqm
    lines:
      - method: 'dqn_cp_ji_encode/dqn_cp_ji-s_<s>'
        num_tasks: 3
        test_env: 0
        label: 'P(1)'
        color: "#3A9AB2"
        linewidth: 0.5
        smooth: 1

      - method: 'dqn_cp_ji_encode/dqn_cp_ji-s_<s>'
        num_tasks: 3
        test_env: 0
        label: 'P(1)'
        color: "#EBCC2A"
        linewidth: 1.5
        smooth: 5