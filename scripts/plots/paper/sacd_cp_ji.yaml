defaults:
  env_name: InvertedPendulum
  seeds: 50
  timesteps: 100_000
  output_dir: paper
  output_file: sacd_cp_ji
  dpi: 500 # optional: default is 300
  show_timesteps: true
  show_x_label: true
  show_y_label: true
  format: png
  # aggregation: mean

plots:
  ### WITH TASK ID ###

  - title: 'Task 1 performance'
    aggregation: mean_ci
    lines:
      - method: 'sacd_cp_ji_encode_more_freq_eval/sacd_cp_ji-e_auto-s_<s>'
        num_tasks: 3
        test_env: 0
        label: 'P(1)'
        linewidth: 1.5
        color: "#EBCC2A"
        smooth: 5


