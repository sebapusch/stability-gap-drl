defaults:
  env_name: InvertedPendulum
  seeds: 50
  timesteps: 200_000
  output_dir: paper
  output_file: dqn_cp_ji
  dpi: 500 # optional: default is 300
  show_timesteps: true
  show_x_label: true
  show_y_label: true
  format: png
  aggregation: mean_ci

plots:
  - title: 'Task 1 performance'
    lines:
      - method: 'dqn_cp_ji_encode_more_freq_eval/dqn_cp_ji-s_<s>'
        num_tasks: 3
        test_env: 0
        label: 'Task 1'
        color: "#EBCC2A"
        linewidth: 1
        smooth: 5

      - method: 'dqn_cp_ji_encode_more_freq_eval/dqn_cp_ji-s_<s>'
        num_tasks: 3
        test_env: 1
        label: 'Task 2'
        color: "#EBCC2A"
        linewidth: 1
        smooth: 5

